name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Start local Supabase
      run: |
        npx supabase start
        npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' > /tmp/supabase.env
        source /tmp/supabase.env
        echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
        echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV
        echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV
    - name: Run unit tests
      run: npm run test:unit
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        DATABASE_URL: ${{ env.DATABASE_URL }}
    - name: Build application
      run: npm run build
      env:
        PLAYWRIGHT_TEST: 'true'
        NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        DATABASE_URL: ${{ env.DATABASE_URL }}
        CRON_SECRET: test-cron-secret-12345
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
        NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
        NEXT_DIST_DIR: .next-e2e
    - name: Run Playwright tests
      run: npx playwright test --project=chromium
      env:
        PLAYWRIGHT_TEST: 'true'
        NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
        DATABASE_URL: ${{ env.DATABASE_URL }}
        CRON_SECRET: test-cron-secret-12345
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
        NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
        NEXT_DIST_DIR: .next-e2e
        TEST_BASE_URL: http://127.0.0.1:3100
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
