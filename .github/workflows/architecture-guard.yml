name: Architecture Guard & CI Quality Gate

on:
  push:
    branches: [ main, phase18-wip ]
  pull_request:
    branches: [ main, phase18-wip ]

jobs:
  architecture-guard:
    name: Architecture & Quality Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Lint Check
        run: npm run lint

      - name: 2. TypeScript Check
        run: npx tsc --noEmit --skipLibCheck

      - name: 3. Architecture Guards Check
        run: node scripts/check-architecture-guards.mjs

      - name: Start local Supabase
        run: |
          npx supabase start
          npx supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' > /tmp/supabase.env
          source /tmp/supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV
          echo "DATABASE_URL=$DB_URL" >> $GITHUB_ENV

      - name: 4. Unit & Architecture Tests
        run: npx vitest run
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: 5. Next.js Production Build Test
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
