name: Architecture Guard & CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  architecture-guard:
    name: Architecture & Quality Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: 1. Lint Check
        run: npm run lint

      - name: 2. TypeScript Check
        run: npx tsc --noEmit --skipLibCheck

      - name: 3. Architecture Guards Check
        run: node scripts/check-architecture-guards.mjs

      - name: 4. Unit & Architecture Tests
        run: npx vitest run

      - name: 5. Next.js Production Build Test
        run: npm run build
