<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="iOS App Store Banner" shape-rendering="geometricPrecision" preserveAspectRatio="xMidYMid meet">
  <title>iOS App Store Banner</title>
  <desc>OPOS Phase 2 Asset: iOS App Store Banner</desc>
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F2DBA" flood-opacity="0.25" />
    </filter>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8FF" />
      <stop offset="100%" stop-color="#EEEDF4" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F2DBA" />
      <stop offset="100%" stop-color="#3800A4" />
    </linearGradient>
    <linearGradient id="medical-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B9FE8" />
    </linearGradient>
    <linearGradient id="glass-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#bg-grad)"/>
  <rect x="60" y="50" width="280" height="150" rx="20" fill="url(#glass-card-grad)" stroke="#FFFFFF" stroke-width="2" filter="url(#soft-shadow)"/>
  <circle cx="200" cy="125" r="35" fill="url(#primary-grad)" filter="url(#glow-purple)"/>
  <g transform="translate(200, 125) scale(1.2)" fill="#FFFFFF"><g class="paw-icon"><ellipse cx="0" cy="8" rx="8" ry="10" fill="currentColor"/><ellipse cx="-11" cy="-4" rx="4" ry="5.5" fill="currentColor"/><ellipse cx="-4" cy="-11" rx="4" ry="5.5" fill="currentColor"/><ellipse cx="4" cy="-11" rx="4" ry="5.5" fill="currentColor"/><ellipse cx="11" cy="-4" rx="4" ry="5.5" fill="currentColor"/></g></g>
  <text x="200" y="240" font-family="Montserrat, sans-serif" font-weight="700" font-size="16" fill="#1A1B20" text-anchor="middle">iOS App Store Banner</text>
  <text x="200" y="262" font-family="Montserrat, sans-serif" font-weight="500" font-size="12" fill="#697386" text-anchor="middle">[ Tier: P2 | Module: marketing ]</text>
  </svg>